# ---------------------------------------------------------------------------
# ALB Ingress (Task #2) - ONE internet-facing ALB routes by path:
#   /orders* -> orders-node Service
#   /users*  -> users-python Service
# Requires the AWS Load Balancer Controller installed (IRSA-backed).
# HTTP only for now; an HTTPS listener (ACM cert + real domain) is a later step.
# ---------------------------------------------------------------------------
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: apps
  namespace: dev
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80}]'
    alb.ingress.kubernetes.io/healthcheck-path: /health
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          - path: /orders
            pathType: Prefix
            backend:
              service:
                name: orders-node
                port:
                  number: 80
          - path: /users
            pathType: Prefix
            backend:
              service:
                name: users-python
                port:
                  number: 80
